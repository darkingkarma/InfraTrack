
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraTrack - Email Verified</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 40px 28px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            color: #0A2E5C;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            font-size: 40px;
        }

        h1 {
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        .button {
            display: block;
            margin-top: 28px;
            padding: 14px;
            border-radius: 9px;
            background: #0A2E5C;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">InfraTrack</div>

        <div class="success-icon">✓</div>

        <h1>Email Verified!</h1>

        <p>
            Your email address has been successfully verified.
            Your InfraTrack account has been created and is now active.
        </p>

        <p>
            You can now return to the InfraTrack mobile application
            and log in using your registered account.
        </p>

        <a href="#" class="button" onclick="window.close(); return false;">
            Done
        </a>

        <div class="footer">
            DPWH Iligan City District Engineering Office
        </div>
    </div>
</body>
</html>
