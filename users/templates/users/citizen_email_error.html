<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraTrack - Verification Error</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 40px 28px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .logo {
            color: #0A2E5C;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            color: #0f172a;
            font-size: 25px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">InfraTrack</div>

        <div class="icon">!</div>

        <h1>Verification Failed</h1>

        <p>{{ message }}</p>

        <p>
            If you still need to create an account,
            please return to the InfraTrack application
            and try registering again.
        </p>

        <div class="footer">
            DPWH Iligan City District Engineering Office
        </div>
    </div>
</body>
</html>
